name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $commit = git rev-parse --short HEAD
          
          $targets = @(
              "windows/amd64",
              "windows/arm64",
              "linux/amd64",
              "linux/arm64",
              "darwin/amd64",
              "darwin/arm64"
          )
          
          New-Item -ItemType Directory -Force -Path "dist"
          
          foreach ($target in $targets) {
              $os, $arch = $target.Split("/")
              $ext = if ($os -eq "windows") { ".exe" } else { "" }
              $output = "dist/nolife-${os}-${arch}${ext}"
              
              Write-Host "Building $target..."
              $env:GOOS = $os
              $env:GOARCH = $arch
              
              go build -trimpath -ldflags="-s -w -X 'main.version=$version' -X 'main.commit=$commit' -X 'main.date=$date'" -o $output ./cmd/nolife
          }
          
          # Generate checksums
          cd dist
          Get-ChildItem -File | Where-Object { $_.Extension -ne ".sha256" } | ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              $hashString = "$($hash.Hash.ToLower())  $($_.Name)"
              $hashString | Out-File -FilePath "$($_.Name).sha256" -Encoding ascii
          }

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/* --title "Release ${{ github.ref_name }}" --generate-notes
